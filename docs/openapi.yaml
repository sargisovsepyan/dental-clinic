openapi: 3.1.0
info:
  title: Dental Clinic Backend API
  version: 1.0.0
  description: >-
    Implemented backend contract. Dates and clock times are interpreted in the
    configured clinic timezone. Production cookie-authenticated operations also
    require an exact allowed Origin header.
servers:
  - url: /api/v1
security: []
tags:
  - name: System
    description: Process liveness and dependency readiness.
  - name: Auth
    description: Staff authentication, rotating sessions, and password lifecycle.
  - name: Staff
    description: Administrator-controlled staff lifecycle and session revocation.
  - name: Catalog
    description: Public and administrative clinic editorial content.
  - name: Scheduling
    description: Clinic hours, dentist schedules, and public availability.
  - name: Appointments
    description: Public booking and authorized appointment administration.
  - name: Media
    description: Governed image upload, replacement, gallery, and cleanup operations.
  - name: BeforeAfter
    description: Before/after publication and consent-governance operations.
  - name: Audit
    description: Administrator-only business audit-log access.
paths:
  /health:
    get:
      tags: [System]
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /health/live:
    get:
      tags: [System]
      operationId: getExplicitLiveness
      summary: Process liveness
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      summary: Mongo and required Redis readiness
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate staff and set refresh cookie
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccess
      summary: Atomically rotate refresh token
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': { $ref: '#/components/responses/AuthSuccess' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke current refresh session and clear cookie
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Return an enumeration-safe accepted response
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/setup-password:
    post:
      tags: [Auth]
      operationId: setupInvitedPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /staff:
    get:
      tags: [Staff]
      operationId: listStaff
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: setupComplete
          in: query
          schema: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /staff/invite:
    post:
      tags: [Staff]
      operationId: inviteStaff
      description: Admin only. Sends a one-time setup link through the configured mail adapter.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInviteRequest' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /staff/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Staff]
      operationId: getStaff
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /staff/{id}/role:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Staff]
      operationId: updateStaffRole
      description: Admin only; last-admin and self-lockout invariants apply.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties: { role: { $ref: '#/components/schemas/Role' } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /staff/{id}/deactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Staff]
      operationId: deactivateStaff
      description: Admin only; invalidates all authorization immediately.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /staff/{id}/reactivate:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Staff]
      operationId: reactivateStaff
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /staff/{id}/revoke-sessions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Staff]
      operationId: revokeStaffSessions
      description: Admin only; increments authorization version.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /service-categories:
    get:
      tags: [Catalog]
      operationId: listServiceCategories
      responses: { '200': { $ref: '#/components/responses/ServiceCategoryListSuccess' } }
    post:
      tags: [Catalog]
      operationId: createServiceCategory
      description: Admin only.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ServiceCategoryCreate' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /service-categories/admin/all:
    get:
      tags: [Catalog]
      operationId: listAllServiceCategories
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /service-categories/{identifier}:
    get:
      tags: [Catalog]
      operationId: getServiceCategory
      description: The GET operation interprets the identifier as a canonical slug.
      parameters: [{ $ref: '#/components/parameters/SlugIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/ServiceCategoryDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Catalog]
      operationId: updateServiceCategory
      description: Admin only; interprets the identifier as a MongoDB ObjectId.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      requestBody: { $ref: '#/components/requestBodies/ServiceCategoryUpdate' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Catalog]
      operationId: disableServiceCategory
      description: Admin only; interprets the identifier as a MongoDB ObjectId and soft-disables the category.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /service-categories/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Catalog]
      operationId: restoreServiceCategory
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /services:
    get:
      tags: [Catalog]
      operationId: listServices
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: bookingEnabled, in: query, schema: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/ServiceListSuccess' } }
    post:
      tags: [Catalog]
      operationId: createService
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ServiceCreate' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /services/admin/all:
    get:
      tags: [Catalog]
      operationId: listAllServices
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /services/{identifier}:
    get:
      tags: [Catalog]
      operationId: getService
      description: The GET operation interprets the identifier as a canonical slug.
      parameters: [{ $ref: '#/components/parameters/SlugIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/ServiceDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Catalog]
      operationId: updateService
      description: Admin only; interprets the identifier as a MongoDB ObjectId.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      requestBody: { $ref: '#/components/requestBodies/ServiceUpdate' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Catalog]
      operationId: disableService
      description: Admin only; interprets the identifier as a MongoDB ObjectId.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /services/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Catalog]
      operationId: restoreService
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /dentists:
    get:
      tags: [Catalog]
      operationId: listDentists
      parameters:
        - { name: service, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: bookingEnabled, in: query, schema: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/DentistListSuccess' } }
    post:
      tags: [Catalog]
      operationId: createDentist
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/DentistCreate' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' } }
  /dentists/admin/all:
    get:
      tags: [Catalog]
      operationId: listAllDentists
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /dentists/{identifier}:
    get:
      tags: [Catalog]
      operationId: getDentist
      description: The GET operation interprets the identifier as a canonical slug.
      parameters: [{ $ref: '#/components/parameters/SlugIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/DentistDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Catalog]
      operationId: updateDentist
      description: >-
        Admin only; interprets the identifier as a MongoDB ObjectId. A weekly
        schedule change requires the current schedule revision and may require
        replay with the exact conflict acknowledgement returned by a 409.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      requestBody: { $ref: '#/components/requestBodies/DentistUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
    delete:
      tags: [Catalog]
      operationId: disableDentist
      description: Admin only; interprets the identifier as a MongoDB ObjectId.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ObjectIdIdentifier' }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /dentists/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Catalog]
      operationId: restoreDentist
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /dentists/{id}/schedule-exceptions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Scheduling]
      operationId: listDentistScheduleExceptions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /dentists/{id}/schedule-exceptions/{date}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
      - { $ref: '#/components/parameters/DatePath' }
    put:
      tags: [Scheduling]
      operationId: upsertDentistScheduleException
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/DentistScheduleException' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
    delete:
      tags: [Scheduling]
      operationId: deleteDentistScheduleException
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedScheduleRevision' }
        - { $ref: '#/components/parameters/ScheduleConflictAcknowledgement' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
  /clinic:
    get:
      tags: [Catalog]
      operationId: getClinic
      responses: { '200': { $ref: '#/components/responses/ClinicPublicSuccess' } }
    patch:
      tags: [Catalog]
      operationId: updateClinic
      security: [{ bearerAuth: [] }]
      description: >-
        Admin only. Updating weeklySchedule requires expectedScheduleRevision.
        A 409 may return an exact acknowledgement token for the same proposal.
        Booking-setting changes are serialized with booking admission.
      requestBody: { $ref: '#/components/requestBodies/ClinicUpdate' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
  /clinic/closures:
    get:
      tags: [Scheduling]
      operationId: listClinicClosures
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /clinic/closures/{date}:
    parameters: [{ $ref: '#/components/parameters/DatePath' }]
    put:
      tags: [Scheduling]
      operationId: upsertClinicClosure
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ClinicScheduleException' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
    delete:
      tags: [Scheduling]
      operationId: deleteClinicClosure
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ExpectedScheduleRevision' }
        - { $ref: '#/components/parameters/ScheduleConflictAcknowledgement' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/ScheduleConflict' }
  /availability:
    get:
      tags: [Scheduling]
      operationId: getAvailability
      parameters:
        - { name: dentistId, in: query, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: serviceId, in: query, required: true, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: date, in: query, required: true, schema: { $ref: '#/components/schemas/LocalDate' } }
      responses:
        '200': { $ref: '#/components/responses/AvailabilitySuccess' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /appointments:
    get:
      tags: [Appointments]
      operationId: listAppointments
      description: Admin or receptionist.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: date, in: query, schema: { $ref: '#/components/schemas/LocalDate' } }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { name: dentistId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: serviceId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AppointmentStatus' } }
        - { name: phone, in: query, schema: { type: string, maxLength: 30 } }
      responses: { '200': { $ref: '#/components/responses/AppointmentListSuccess' } }
    post:
      tags: [Appointments]
      operationId: createPublicAppointment
      description: >-
        Public booking. Idempotency-Key is mandatory. Production also requires
        challengeToken. A successful retry with the same key and semantic body
        returns the original immutable public result with status 201; reuse with
        a different body returns 409. Successful records expire after the
        configured 1-168 hour idempotency window (24 hours by default), after
        which the key may create a new booking. Notification jobs are committed
        transactionally and delivered asynchronously; SMTP never controls booking
        acceptance.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicBookingRequest' }
      responses:
        '201': { $ref: '#/components/responses/PublicBookingSuccess' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /appointments/admin:
    post:
      tags: [Appointments]
      operationId: createAdminAppointment
      description: Admin or receptionist.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBookingRequest' }
      responses:
        '201': { $ref: '#/components/responses/AppointmentSuccess' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /appointments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Appointments]
      operationId: getAppointment
      description: Admin or receptionist.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/AppointmentSuccess' }, '404': { $ref: '#/components/responses/Error' } }
  /appointments/{id}/reschedule:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Appointments]
      operationId: rescheduleAppointment
      description: >-
        Admin or receptionist. Only pending or confirmed appointments may be
        rescheduled. The old lock remains on any failure; selecting the exact
        current occurrence is a concurrency-fenced no-op.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/AppointmentSuccess' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /appointments/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Appointments]
      operationId: updateAppointmentStatus
      description: Admin or receptionist; validated state transitions only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/AppointmentSuccess' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /appointments/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      description: Admin or receptionist; releases booking and quota locks.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 2, maxLength: 500 } }
      responses:
        '200': { $ref: '#/components/responses/AppointmentSuccess' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /media/gallery:
    get:
      tags: [Media]
      operationId: listGallery
      responses: { '200': { $ref: '#/components/responses/GalleryPublicSuccess' } }
    post:
      tags: [Media]
      operationId: createGalleryImage
      description: Admin only. Maximum image size is 5 MiB and magic bytes are verified.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/GalleryUpload' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '415': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /media/gallery/admin:
    get:
      tags: [Media]
      operationId: listAllGallery
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /media/gallery/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Media]
      operationId: updateGalleryImage
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/GalleryUpdate' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [Media]
      operationId: disableGalleryImage
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /media/gallery/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Media]
      operationId: restoreGalleryImage
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /media/dentists/{id}/photo:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Media]
      operationId: replaceDentistPhoto
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageUpload' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' }, '415': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Media]
      operationId: removeDentistPhoto
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /media/services/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Media]
      operationId: replaceServiceImage
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageUpload' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' }, '415': { $ref: '#/components/responses/Error' } }
    delete:
      tags: [Media]
      operationId: removeServiceImage
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /media/cleanup-jobs:
    get:
      tags: [Media]
      operationId: listMediaCleanupJobs
      description: Admin-only operational cleanup debt listing.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: status
          in: query
          schema: { type: string, enum: [held, pending, processing, completed, failed, cancelled] }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /media/cleanup-jobs/{id}/retry:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Media]
      operationId: retryMediaCleanup
      description: Admin only.
      security: [{ bearerAuth: [] }]
      responses: { '202': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /before-after:
    get:
      tags: [BeforeAfter]
      operationId: listBeforeAfterCases
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/BeforeAfterLimit' }
        - { name: serviceId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: dentistId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
        - { name: featured, in: query, schema: { type: boolean } }
      responses: { '200': { $ref: '#/components/responses/BeforeAfterListSuccess' } }
    post:
      tags: [BeforeAfter]
      operationId: createBeforeAfterCase
      description: Admin only. Consent version is server-controlled.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/BeforeAfterUpload' }
      responses: { '201': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '415': { $ref: '#/components/responses/Error' } }
  /before-after/admin/all:
    get:
      tags: [BeforeAfter]
      operationId: listAllBeforeAfterCases
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/BeforeAfterLimit' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /before-after/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [BeforeAfter]
      operationId: getBeforeAfterCase
      responses: { '200': { $ref: '#/components/responses/BeforeAfterDetailSuccess' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [BeforeAfter]
      operationId: updateBeforeAfterCase
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/BeforeAfterUpdate' }
      responses: { '200': { $ref: '#/components/responses/Success' } }
    delete:
      tags: [BeforeAfter]
      operationId: disableBeforeAfterCase
      description: Soft disable; does not withdraw consent or purge media.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' } }
  /before-after/{id}/restore:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [BeforeAfter]
      operationId: restoreBeforeAfterCase
      description: Refuses withdrawn or purged cases.
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /before-after/{id}/consent/withdraw:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BeforeAfter]
      operationId: withdrawBeforeAfterConsent
      description: Admin only; immediately removes the case from public queries.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties: { reason: { type: string, minLength: 3, maxLength: 500 } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /before-after/{id}/purge:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [BeforeAfter]
      operationId: purgeBeforeAfterMedia
      description: Admin-only permanent media purge after consent withdrawal; retains tombstone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurgeRequest' }
      responses: { '202': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /before-after/{id}/before-image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [BeforeAfter]
      operationId: replaceBeforeImage
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageUpload' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /before-after/{id}/after-image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [BeforeAfter]
      operationId: replaceAfterImage
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ImageUpload' }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: action, in: query, schema: { type: string, maxLength: 120 } }
        - { name: entityType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: entityId, in: query, schema: { type: string, maxLength: 150 } }
        - { name: actorId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }
      responses: { '200': { $ref: '#/components/responses/Success' } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    SlugIdentifier:
      name: identifier
      in: path
      required: true
      description: Canonical lowercase public slug; never interpreted as a database ID.
      schema: { $ref: '#/components/schemas/Slug' }
    ObjectIdIdentifier:
      name: identifier
      in: path
      required: true
      description: MongoDB ObjectId used by an authenticated administrative mutation.
      schema: { $ref: '#/components/schemas/ObjectId' }
    DatePath:
      name: date
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LocalDate' }
    FromDate:
      name: from
      in: query
      schema: { $ref: '#/components/schemas/LocalDate' }
    ToDate:
      name: to
      in: query
      schema: { $ref: '#/components/schemas/LocalDate' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    BeforeAfterLimit:
      name: limit
      in: query
      description: Page size for before/after listings, whose API default is 24.
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Fresh UUIDv4 identifying one intended public booking. Reuse for the same
        semantic request replays the original successful public response within
        the configured idempotency window; reuse for a different request is 409.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    ExpectedScheduleRevision:
      name: expectedScheduleRevision
      in: query
      required: true
      description: Current non-negative schedule revision observed by the administrator.
      schema: { type: integer, minimum: 0 }
    ScheduleConflictAcknowledgement:
      name: scheduleConflictAcknowledgement
      in: query
      required: false
      description: >-
        Exact 64-character token returned by the preceding 409 for this revision,
        proposal, scope, and affected appointment set.
      schema: { $ref: '#/components/schemas/ScheduleAcknowledgementToken' }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
  requestBodies:
    ServiceCategoryCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceCategoryCreateRequest' }
    ServiceCategoryUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceCategoryUpdateRequest' }
    ServiceCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceCreateRequest' }
    ServiceUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceUpdateRequest' }
    DentistCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DentistCreateRequest' }
    ClinicUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ClinicUpdateRequest' }
    DentistUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DentistUpdateRequest' }
    GalleryUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GalleryUpdateRequest' }
    BeforeAfterUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BeforeAfterUpdateRequest' }
    ClinicScheduleException:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedScheduleRevision, isOpen]
            properties:
              expectedScheduleRevision: { type: integer, minimum: 0 }
              scheduleConflictAcknowledgement: { $ref: '#/components/schemas/ScheduleAcknowledgementToken' }
              isOpen: { type: boolean }
              shifts:
                type: array
                maxItems: 6
                items: { $ref: '#/components/schemas/Shift' }
              note: { type: string, maxLength: 300 }
    DentistScheduleException:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expectedScheduleRevision, isWorking]
            properties:
              expectedScheduleRevision: { type: integer, minimum: 0 }
              scheduleConflictAcknowledgement: { $ref: '#/components/schemas/ScheduleAcknowledgementToken' }
              isWorking: { type: boolean }
              shifts:
                type: array
                maxItems: 6
                items: { $ref: '#/components/schemas/Shift' }
              note: { type: string, maxLength: 300 }
    ImageUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [image]
            properties:
              image: { type: string, format: binary }
    GalleryUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [image]
            properties:
              image: { type: string, format: binary }
              altText: { type: string, maxLength: 200 }
              caption: { type: string, maxLength: 500 }
              sortOrder: { type: integer, minimum: 0, maximum: 10000 }
              isActive: { type: boolean }
              translations:
                type: string
                description: JSON object keyed by hy, ru, and en.
    BeforeAfterUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [beforeImage, afterImage, consentConfirmed, consentMethod, translations]
            properties:
              beforeImage: { type: string, format: binary }
              afterImage: { type: string, format: binary }
              title: { type: string, minLength: 2, maxLength: 200 }
              translations:
                type: string
                description: JSON object keyed by hy, ru, and en; Armenian title required when published.
              description: { type: string, maxLength: 2000 }
              serviceId: { $ref: '#/components/schemas/ObjectId' }
              dentistId: { $ref: '#/components/schemas/ObjectId' }
              consentConfirmed: { type: boolean, const: true }
              consentMethod: { type: string, enum: [written, digital, verbal, external] }
              externalConsentReference:
                type: string
                minLength: 3
                maxLength: 120
                description: Required when consentMethod is external; opaque and never public.
              isActive: { type: boolean, default: true }
              isFeatured: { type: boolean, default: false }
              sortOrder: { type: integer, minimum: 0, maximum: 10000 }
  responses:
    Success:
      description: Successful request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SuccessEnvelope' }
    ServiceCategoryListSuccess:
      description: Active public service categories.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceCategoryListEnvelope' }
    ServiceCategoryDetailSuccess:
      description: Active public service category.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceCategoryDetailEnvelope' }
    ServiceListSuccess:
      description: Active public services whose categories are active.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceListEnvelope' }
    ServiceDetailSuccess:
      description: Active public service whose category is active.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ServiceDetailEnvelope' }
    DentistListSuccess:
      description: Active public dentists with public active services only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DentistListEnvelope' }
    DentistDetailSuccess:
      description: Active public dentist with public active services only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DentistDetailEnvelope' }
    ClinicPublicSuccess:
      description: Public clinic settings and regular weekly hours.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ClinicPublicEnvelope' }
    GalleryPublicSuccess:
      description: Active public gallery images.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GalleryPublicEnvelope' }
    BeforeAfterListSuccess:
      description: Published public before/after cases with consent evidence omitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BeforeAfterListEnvelope' }
    BeforeAfterDetailSuccess:
      description: Published public before/after case with consent evidence omitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BeforeAfterDetailEnvelope' }
    AuthSuccess:
      description: Authenticated; refresh cookie may be set
      headers:
        Set-Cookie:
          schema: { type: string }
          description: HttpOnly refresh_token scoped to /api/v1/auth; Secure in production.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/SuccessEnvelope' }
              - type: object
                properties:
                  data:
                    type: object
                    required: [accessToken, user]
                    properties:
                      accessToken: { type: string }
                      user: { $ref: '#/components/schemas/StaffUser' }
    AvailabilitySuccess:
      description: Computed public availability
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              data:
                type: object
                additionalProperties: false
                required: [availability]
                properties:
                  availability: { $ref: '#/components/schemas/Availability' }
    PublicBookingSuccess:
      description: New or idempotently replayed public booking; both use status 201.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, message, data]
            properties:
              success: { type: boolean, const: true }
              message: { type: string }
              data:
                type: object
                additionalProperties: false
                required: [appointment]
                properties:
                  appointment: { $ref: '#/components/schemas/AppointmentPublicResult' }
    AppointmentSuccess:
      description: Authorized appointment result containing administrative fields.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              message: { type: string }
              data:
                type: object
                additionalProperties: false
                required: [appointment]
                properties:
                  appointment: { $ref: '#/components/schemas/AppointmentAdmin' }
    AppointmentListSuccess:
      description: Authorized paginated appointment list.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              data:
                type: object
                additionalProperties: false
                required: [appointments, pagination]
                properties:
                  appointments:
                    type: array
                    items: { $ref: '#/components/schemas/AppointmentAdmin' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    ScheduleConflict:
      description: >-
        Schedule revision conflict, bounded conflict preview requiring exact
        acknowledgement, or conservative scan-limit refusal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ScheduleConflictError' }
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    ObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    Slug:
      type: string
      minLength: 2
      maxLength: 180
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    ScheduleAcknowledgementToken:
      type: string
      minLength: 64
      maxLength: 64
      pattern: '^[0-9a-fA-F]{64}$'
    LocalDate:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      examples: ['2026-08-20']
    LocalTime:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      examples: ['09:30']
    Role:
      type: string
      enum: [admin, receptionist, dentist]
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, checked_in, in_progress, completed, cancelled, no_show]
    SuccessEnvelope:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        code: { type: string }
        details: { type: object, additionalProperties: true }
    StaffUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, isActive, isSetupComplete]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        isActive: { type: boolean }
        isSetupComplete: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        newPassword:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
          description: At least six Unicode characters and at most 72 UTF-8 bytes.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties: { email: { type: string, format: email, maxLength: 254 } }
    TokenPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 40, maxLength: 200, writeOnly: true }
        password:
          type: string
          minLength: 6
          maxLength: 72
          writeOnly: true
          description: Maximum is enforced in UTF-8 bytes.
    StaffInviteRequest:
      type: object
      additionalProperties: false
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role' }
    TranslationText:
      type: object
      additionalProperties: true
    Translations:
      type: object
      additionalProperties: false
      properties:
        hy: { $ref: '#/components/schemas/TranslationText' }
        ru: { $ref: '#/components/schemas/TranslationText' }
        en: { $ref: '#/components/schemas/TranslationText' }
    PublicImageAsset:
      type: object
      additionalProperties: false
      required: [publicId, secureUrl, width, height, format, bytes]
      properties:
        publicId: { type: string }
        secureUrl: { type: string, format: uri }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        format: { type: string }
        bytes: { type: integer, minimum: 1 }
    ServiceCategoryPublic:
      type: object
      additionalProperties: false
      required: [_id, name, slug, description, translations, imageUrl, sortOrder, isActive, createdAt, updatedAt]
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        description: { type: string }
        translations: { $ref: '#/components/schemas/ServiceCategoryTranslations' }
        imageUrl: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
