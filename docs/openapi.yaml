        tagline: { type: string, maxLength: 250 }
        description: { type: string, maxLength: 5000 }
        phone: { type: string, maxLength: 30 }
        secondaryPhone: { type: string, maxLength: 30 }
        email:
          anyOf:
            - { type: string, format: email, maxLength: 254 }
            - { type: string, const: '' }
        address: { type: string, maxLength: 300 }
        mapUrl:
          type: string
          pattern: '^(?:https://.*)?$'
        latitude:
          anyOf:
            - { type: number, minimum: -90, maximum: 90 }
            - { type: 'null' }
        longitude:
          anyOf:
            - { type: number, minimum: -180, maximum: 180 }
            - { type: 'null' }
        socialLinks:
          type: object
          additionalProperties: false
          properties:
            instagram: { type: string, maxLength: 2048 }
            facebook: { type: string, maxLength: 2048 }
            whatsapp: { type: string, maxLength: 2048 }
            telegram: { type: string, maxLength: 2048 }
        weeklySchedule:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/ClinicWorkingDay' }
        bookingSettings: { $ref: '#/components/schemas/BookingSettings' }
    DentistUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        weeklySchedule: [expectedScheduleRevision]
      properties:
        expectedScheduleRevision: { type: integer, minimum: 0 }
        scheduleConflictAcknowledgement: { $ref: '#/components/schemas/ScheduleAcknowledgementToken' }
        firstName: { type: string, minLength: 2, maxLength: 80 }
        lastName: { type: string, minLength: 2, maxLength: 80 }
        title: { type: string, maxLength: 150 }
        translations: { $ref: '#/components/schemas/DentistTranslations' }
        specializations:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 2, maxLength: 100 }
        bio: { type: string, maxLength: 5000 }
        experienceYears: { type: integer, minimum: 0, maximum: 70 }
        languages:
          type: array
          uniqueItems: true
          items: { type: string, enum: [hy, ru, en, fr, de, other] }
        services:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ObjectId' }
        weeklySchedule:
          type: array
          maxItems: 7
          items: { $ref: '#/components/schemas/DentistWorkingDay' }
        isFeatured: { type: boolean }
        bookingEnabled: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    PriceSnapshot:
      type: object
      additionalProperties: false
      required: [priceType, currency]
      properties:
        priceType: { type: string, enum: [fixed, from, range, on_request] }
        priceFrom:
          anyOf:
            - { type: number, minimum: 0 }
            - { type: 'null' }
        priceTo:
          anyOf:
            - { type: number, minimum: 0 }
            - { type: 'null' }
        currency: { type: string, const: AMD }
    DentistPublicSummary:
      type: object
      additionalProperties: false
      required: [id, firstName, lastName]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        firstName: { type: string }
        lastName: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        translations: { $ref: '#/components/schemas/Translations' }
    DentistAdminReference:
      oneOf:
        - { $ref: '#/components/schemas/ObjectId' }
        - type: object
          additionalProperties: false
          required: [_id, firstName, lastName, slug]
          properties:
            _id: { $ref: '#/components/schemas/ObjectId' }
            firstName: { type: string }
            lastName: { type: string }
            slug: { $ref: '#/components/schemas/Slug' }
            title: { type: string }
            translations: { $ref: '#/components/schemas/Translations' }
    ServicePublicSummary:
      type: object
      additionalProperties: false
      required: [id, name, durationMinutes]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        translations: { $ref: '#/components/schemas/Translations' }
        durationMinutes: { type: integer, minimum: 1 }
        priceType: { type: string, enum: [fixed, from, range, on_request] }
        priceFrom:
          anyOf:
            - { type: number, minimum: 0 }
            - { type: 'null' }
        priceTo:
          anyOf:
            - { type: number, minimum: 0 }
            - { type: 'null' }
        currency: { type: string, const: AMD }
    ServiceAdminReference:
      oneOf:
        - { $ref: '#/components/schemas/ObjectId' }
        - type: object
          additionalProperties: false
          required: [_id, name, slug]
          properties:
            _id: { $ref: '#/components/schemas/ObjectId' }
            name: { type: string }
            slug: { $ref: '#/components/schemas/Slug' }
            translations: { $ref: '#/components/schemas/Translations' }
    AvailabilitySlot:
      type: object
      additionalProperties: false
      required: [start, end, startAt, endAt]
      properties:
        start: { $ref: '#/components/schemas/LocalTime' }
        end: { $ref: '#/components/schemas/LocalTime' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    Availability:
      type: object
      additionalProperties: false
      required: [date, timezone, available, reason, dentist, service, rules, slots]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        timezone: { type: string, description: Configured clinic IANA timezone. }
        available: { type: boolean }
        reason:
          anyOf:
            - type: string
              enum: [SAME_DAY_BOOKING_DISABLED, CLINIC_CLOSED, DENTIST_NOT_WORKING, NO_COMMON_WORKING_TIME, FULLY_BOOKED]
            - { type: 'null' }
        dentist: { $ref: '#/components/schemas/DentistPublicSummary' }
        service: { $ref: '#/components/schemas/ServicePublicSummary' }
        rules:
          type: object
          additionalProperties: false
          required: [slotIntervalMinutes, bufferMinutes, minBookingNoticeMinutes]
          properties:
            slotIntervalMinutes: { type: integer, enum: [10, 15, 20, 30, 60] }
            bufferMinutes: { type: integer, minimum: 0, maximum: 120 }
            minBookingNoticeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        schedule:
          type: object
          additionalProperties: false
          description: Present when the effective clinic and dentist schedules were evaluated.
          required: [clinicSource, dentistSource, clinicRevision, dentistRevision]
          properties:
            clinicSource: { type: string, enum: [weekly, exception] }
            dentistSource: { type: string, enum: [weekly, exception] }
            clinicRevision: { type: integer, minimum: 0 }
            dentistRevision: { type: integer, minimum: 0 }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }
    AppointmentPublicResult:
      type: object
      additionalProperties: false
      description: >-
        Safe result returned only to the public booking caller. It intentionally
        excludes phone, email, comments, internal notes, consent evidence,
        mutation history, lock keys, and idempotency internals.
      required: [id, confirmationCode, patientName, date, startTime, endTime, status, dentist, service, price]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        confirmationCode: { type: string, pattern: '^DC-[0-9A-F]{16}$' }
        patientName: { type: string, minLength: 2, maxLength: 120 }
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        endTime: { $ref: '#/components/schemas/LocalTime' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        dentist: { $ref: '#/components/schemas/DentistPublicSummary' }
        service: { $ref: '#/components/schemas/ServicePublicSummary' }
        price: { $ref: '#/components/schemas/PriceSnapshot' }
    AppointmentSnapshotPoint:
      type: object
      additionalProperties: false
      required: [dentist, service, date, startTime, endTime]
      properties:
        dentist: { $ref: '#/components/schemas/ObjectId' }
        service: { $ref: '#/components/schemas/ObjectId' }
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        endTime: { $ref: '#/components/schemas/LocalTime' }
    RescheduleHistoryEntry:
      type: object
      additionalProperties: false
      required: [actor, reason, from, to, changedAt]
      properties:
        actor:
          anyOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { type: 'null' }
        reason: { type: string, maxLength: 500 }
        from: { $ref: '#/components/schemas/AppointmentSnapshotPoint' }
        to: { $ref: '#/components/schemas/AppointmentSnapshotPoint' }
        changedAt: { type: string, format: date-time }
    AppointmentAdmin:
      type: object
      additionalProperties: false
      description: >-
        Authorized administrative appointment. This includes patient contact
        data, internal notes, reschedule history, and server-recorded privacy
        evidence; it is never a public collection schema.
      required:
        - _id
        - confirmationCode
        - patientName
        - patientPhone
        - patientEmail
        - dentist
        - service
        - dentistSnapshot
        - serviceSnapshot
        - priceSnapshot
        - date
        - startTime
        - endTime
        - startAt
        - endAt
        - bufferMinutes
        - mutationVersion
        - scheduleRevision
        - notificationLocale
        - rescheduleHistory
        - status
        - source
        - patientComment
        - internalNote
        - privacyConsentAt
        - privacyConsentMethod
        - privacyPolicyVersion
        - createdAt
        - updatedAt
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        confirmationCode: { type: string, pattern: '^DC-[0-9A-F]{16}$' }
        patientName: { type: string, minLength: 2, maxLength: 120 }
        patientPhone: { type: string, maxLength: 20 }
        patientEmail: { type: string, maxLength: 254 }
        dentist: { $ref: '#/components/schemas/DentistAdminReference' }
        service: { $ref: '#/components/schemas/ServiceAdminReference' }
        dentistSnapshot:
          type: object
          additionalProperties: false
          required: [firstName, lastName, title, translations]
          properties:
            firstName: { type: string }
            lastName: { type: string }
            title: { type: string }
            translations: { $ref: '#/components/schemas/Translations' }
        serviceSnapshot:
          type: object
          additionalProperties: false
          required: [name, durationMinutes, translations]
          properties:
            name: { type: string }
            durationMinutes: { type: integer, minimum: 1 }
            translations: { $ref: '#/components/schemas/Translations' }
        priceSnapshot: { $ref: '#/components/schemas/PriceSnapshot' }
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        endTime: { $ref: '#/components/schemas/LocalTime' }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        bufferMinutes: { type: integer, minimum: 0 }
        mutationVersion: { type: integer, minimum: 0 }
        scheduleRevision:
          type: integer
          minimum: 0
          description: Increments only when the committed appointment occurrence changes.
        notificationLocale:
          description: >-
            Persisted locale for future notifications. Null identifies a legacy
            appointment for which no historical preference was recorded; delivery
            then uses the documented Armenian fallback.
          anyOf:
            - { type: string, enum: [hy, ru, en] }
            - { type: 'null' }
        rescheduleHistory:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/RescheduleHistoryEntry' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        source: { type: string, enum: [website, phone, admin] }
        patientComment: { type: string, maxLength: 1000 }
        internalNote: { type: string, maxLength: 2000 }
        privacyConsentAt: { type: string, format: date-time }
        privacyConsentMethod: { type: string, enum: [website, phone, in_person] }
        privacyPolicyVersion:
          type: string
          pattern: '^(?:[0-9]{4}-[0-9]{2}(?:\.[0-9]+)?|legacy-unverified)$'
        createdBy:
          anyOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { type: 'null' }
        cancelledAt:
          anyOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        cancelledBy:
          anyOf:
            - { $ref: '#/components/schemas/ObjectId' }
            - { type: 'null' }
        cancellationReason: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Pagination:
      type: object
      additionalProperties: false
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 0 }
    ScheduleConflictAppointment:
      type: object
      additionalProperties: false
      required: [appointmentId, date, startTime, endTime, dentistId, status]
      properties:
        appointmentId: { $ref: '#/components/schemas/ObjectId' }
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        endTime: { $ref: '#/components/schemas/LocalTime' }
        dentistId: { $ref: '#/components/schemas/ObjectId' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
    ScheduleConflictError:
      type: object
      additionalProperties: false
      required: [success, message]
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        code:
          type: string
          enum:
            - SCHEDULE_REVISION_CONFLICT
            - SCHEDULE_CONFLICT_ACKNOWLEDGEMENT_REQUIRED
            - SCHEDULE_CONFLICT_SCAN_LIMIT
        details:
          type: object
          additionalProperties: false
          properties:
            currentScheduleRevision: { type: integer, minimum: 0 }
            conflictCount: { type: integer, minimum: 1 }
            conflicts:
              type: array
              maxItems: 25
              items: { $ref: '#/components/schemas/ScheduleConflictAppointment' }
            conflictsTruncated: { type: boolean }
            acknowledgementToken: { $ref: '#/components/schemas/ScheduleAcknowledgementToken' }
    PatientBookingFields:
      type: object
      required: [patientName, patientPhone, dentistId, serviceId, date, startTime, privacyAccepted]
      properties:
        patientName: { type: string, minLength: 2, maxLength: 120 }
        patientPhone: { type: string, minLength: 8, maxLength: 30 }
        patientEmail:
          anyOf:
            - { type: string, format: email, maxLength: 254 }
            - { type: string, const: '' }
        dentistId: { $ref: '#/components/schemas/ObjectId' }
        serviceId: { $ref: '#/components/schemas/ObjectId' }
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        patientComment: { type: string, maxLength: 1000 }
        locale:
          type: string
          enum: [hy, ru, en]
          default: hy
          description: Language used for appointment notifications and reminders.
        privacyAccepted:
          type: boolean
          const: true
          description: >-
            Acceptance of the server-configured current privacy policy. The server
            records its own timestamp, method, and policy version; clients do not
            submit those evidence fields.
    PublicBookingRequest:
      allOf:
        - { $ref: '#/components/schemas/PatientBookingFields' }
        - type: object
          required: [challengeToken]
          properties:
            challengeToken:
              type: string
              minLength: 10
              maxLength: 4096
              writeOnly: true
              description: >-
                Required in production for the configured bot-challenge provider.
                It may be omitted only when challenge verification is explicitly
                disabled in a non-production environment.
      unevaluatedProperties: false
    AdminBookingRequest:
      allOf:
        - { $ref: '#/components/schemas/PatientBookingFields' }
        - type: object
          required: [consentMethod]
          properties:
            consentMethod: { type: string, enum: [phone, in_person] }
            source: { type: string, enum: [phone, admin], default: phone }
            internalNote: { type: string, maxLength: 2000 }
      unevaluatedProperties: false
    RescheduleRequest:
      type: object
      additionalProperties: false
      required: [date, startTime]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        startTime: { $ref: '#/components/schemas/LocalTime' }
        dentistId: { $ref: '#/components/schemas/ObjectId' }
        serviceId: { $ref: '#/components/schemas/ObjectId' }
        reason: { type: string, maxLength: 500 }
    AppointmentStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [confirmed, checked_in, in_progress, completed, no_show] }
        internalNote: { type: string, maxLength: 2000 }
    PurgeRequest:
      type: object
      additionalProperties: false
      required: [confirmation, reason]
      properties:
        confirmation: { type: string, const: 'PERMANENTLY PURGE BEFORE AFTER MEDIA' }
        reason: { type: string, minLength: 3, maxLength: 500 }
